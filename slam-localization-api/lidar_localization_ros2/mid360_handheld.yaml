# Handheld Livox MID-360 localization against a prebuilt PCD map.
# Sensor topics and frame IDs are set by mid360_handheld_localization.launch.py.

/**:
  ros__parameters:
    registration_method: "NDT_OMP"
    score_threshold: 2.0
    ndt_resolution: 1.0
    ndt_step_size: 0.1
    ndt_num_threads: 4
    ndt_max_iterations: 35

    gicp_corr_randomness: 20
    gicp_max_correspondence_distance: 2.0
    vgicp_voxel_resolution: 1.0

    transform_epsilon: 0.01
    voxel_leaf_size: 0.2
    scan_max_range: 100.0
    scan_min_range: 1.0
    scan_period: 0.1

    use_pcd_map: true
    map_path: "/home/kurima/ros2_ws/src/lidar_localization_ros2/map/atr_out_points.pcd"

    # Recommended for field/replay testing:
    # initialize or reinitialize from RViz "2D Pose Estimate".
    set_initial_pose: false
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_qw: 1.0

    # Handheld mode: no robot odometry.
    use_odom: false
    enable_map_odom_tf: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: livox_frame

    use_twist_prediction: false
    max_twist_prediction_dt: 0.5

    # MID-360 IMU prediction.
    use_imu: false
    use_imu_preintegration: true
    imu_preintegration_use_base_frame_transform: false
    imu_accel_scale: 1.0
    imu_dual_queue_enabled: true

    imu_prediction_correction_guard_translation_m: 2.0
    imu_prediction_correction_guard_yaw_deg: 4.0
    imu_prediction_correction_guard_warmup_accepts: 5
    imu_seed_consistency_gate_enabled: true
    imu_seed_consistency_max_translation_error_m: 0.5
    imu_seed_consistency_max_rotation_error_deg: 5.0
    imu_seed_consistency_required_consecutive_passes: 5

    # Safe fallback: if point timing / motion data are not ready,
    # the input scan is kept unchanged.
    use_continuous_time_deskew: true

    enable_reinitialization_request_output: true
    enable_reinitialization_request_latch: true
    reinitialization_trigger_threshold: 0.95
    reinitialization_trigger_gap_scale_sec: 30.0
    reinitialization_trigger_seed_translation_scale_m: 100.0
    reinitialization_trigger_reject_streak_scale: 200.0
    reinitialization_trigger_fitness_explosion_threshold: 1000.0

    enable_debug: true
    predict_pose_from_previous_delta: true
    reject_above_score_threshold: true
    enable_timer_publishing: false
    pose_publish_frequency: 30.0
