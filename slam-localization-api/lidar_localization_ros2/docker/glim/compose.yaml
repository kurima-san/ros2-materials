services:
  glim:
    image: glim-mapping:humble-cuda12.6
    build:
      context: ../..
      dockerfile: docker/glim/Dockerfile
    network_mode: host
    ipc: host
    gpus: all
    environment:
      DISPLAY: ${DISPLAY:-:0}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/glim/config:/data/config:rw
      - ${HOME}/ros_bags:/data/bags:rw
      - ${HOME}/glim_maps:/data/maps:rw
    command: >-
      ros2 run glim_ros glim_rosnode
      --ros-args -p config_path:=/data/config/glim
    stdin_open: true
    tty: true
