x-runtime: &runtime
  image: mid360-glim-localization:humble-cuda12.6
  build:
    context: ../..
    dockerfile: docker/all-in-one/Dockerfile
  network_mode: host
  ipc: host
  gpus: all
  environment: &runtime-environment
    DISPLAY: ${DISPLAY:-:0}
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    QT_X11_NO_MITSHM: "1"
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    INPUT_MODE: ${INPUT_MODE:-realtime}
    BAG_PATH: ${BAG_PATH:-}
    RECORD_BAG: ${RECORD_BAG:-false}
    SENSOR_MODEL: ${SENSOR_MODEL:-mid360s}
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${HOME}/mid360_stack/config:/data/config:rw
    - ${HOME}/ros_bags:/data/bags:rw
    - ${HOME}/ros2_maps:/data/maps:rw
  stdin_open: true
  tty: true

services:
  mapping:
    <<: *runtime
    environment:
      <<: *runtime-environment
      PIPELINE: mapping

  localization:
    <<: *runtime
    environment:
      <<: *runtime-environment
      PIPELINE: localization
      LOCALIZATION_RVIZ: ${LOCALIZATION_RVIZ:-true}
