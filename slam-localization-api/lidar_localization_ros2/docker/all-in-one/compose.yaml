services:
  # 設定ファイルの初期生成にはGPUを要求しない。stackを使うと、コマンドが
  # `true`でもコンテナ作成時にGPU/CDIの検出が走るため、専用serviceに分ける。
  init:
    image: mid360-glim-localization:humble-cuda12.6
    profiles: [tools]
    volumes:
      - ${HOME}/mid360_stack/config:/data/config:rw

  stack:
    image: mid360-glim-localization:humble-cuda12.6
    build:
      context: ../..
      dockerfile: docker/all-in-one/Dockerfile
    network_mode: host
    ipc: host
    gpus: all
    environment:
      DISPLAY: ${DISPLAY:-:0}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      ENABLE_GLIM: ${ENABLE_GLIM:-true}
      ENABLE_LOCALIZATION: ${ENABLE_LOCALIZATION:-true}
      LOCALIZATION_RVIZ: ${LOCALIZATION_RVIZ:-false}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/mid360_stack/config:/data/config:rw
      - ${HOME}/ros_bags:/data/bags:rw
      - ${HOME}/ros2_maps:/data/maps:rw
    stdin_open: true
    tty: true
