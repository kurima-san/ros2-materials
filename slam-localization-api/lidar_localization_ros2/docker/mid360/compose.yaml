services:
  mid360:
    image: livox-mid360:humble
    build:
      context: ../..
      dockerfile: docker/mid360/Dockerfile
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/mid360/config:/data/config:rw
      - ${HOME}/ros_bags:/data/bags:rw
    command: >-
      ros2 launch livox_ros_driver2 rviz_MID360_launch.py
      user_config_path:=/data/config/MID360_config.json
    stdin_open: true
    tty: true
