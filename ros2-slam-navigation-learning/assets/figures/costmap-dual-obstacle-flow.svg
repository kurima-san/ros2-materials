<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">障害物が片側だけに入った場合の違い</title><desc id="desc">Global欠落Local検出では旧経路への追従が続くが局所で停止可能。両方欠落では衝突する指令の恐れ。両方検出と再計画では迂回経路が候補になる。</desc>
<rect width="100%" height="100%" rx="12" fill="#f8fafc"/>
<g font-family="Noto Sans CJK JP, sans-serif" fill="#25364b">
<rect x="20" y="15" width="300" height="325" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
<text x="32" y="48" font-size="18" fill="#25364b">① Global欠落・Local検出</text>
<rect x="50" y="100" width="240" height="160" fill="#eef2f7" stroke="#8794a5" rx="3"/>
<circle cx="82" cy="180" r="16" fill="#2764b0"/>
<text x="72" y="186" font-size="16" fill="#ffffff">R</text>
<text x="265" y="185" font-size="18" fill="#25364b">G</text>
<rect x="173" y="135" width="25" height="90" fill="#f3c1c9" stroke="#b83449" rx="3"/>
<text x="160" y="125" font-size="15" fill="#b83449">実物</text>
<path d="M100,180 L260,180" fill="none" stroke="#167451" stroke-width="3" stroke-dasharray="7 5"/>
<path d="M150,161 L150,199" fill="none" stroke="#b83449" stroke-width="3"/>
<text x="35" y="295" font-size="17" fill="#25364b">閉塞側の局所目標が続く場合</text>
<text x="35" y="322" font-size="16" fill="#b83449">Localで停止・回避は可能</text>
<rect x="350" y="15" width="300" height="325" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
<text x="362" y="48" font-size="18" fill="#25364b">② GlobalもLocalも欠落</text>
<rect x="380" y="100" width="240" height="160" fill="#eef2f7" stroke="#8794a5" rx="3"/>
<circle cx="412" cy="180" r="16" fill="#2764b0"/>
<text x="402" y="186" font-size="16" fill="#ffffff">R</text>
<text x="595" y="185" font-size="18" fill="#25364b">G</text>
<rect x="503" y="135" width="25" height="90" fill="#f3c1c9" stroke="#b83449" rx="3"/>
<text x="490" y="125" font-size="15" fill="#b83449">実物</text>
<path d="M430,180 L590,180" fill="none" stroke="#167451" stroke-width="3" stroke-dasharray="7 5"/>
<text x="365" y="295" font-size="17" fill="#b83449">計画も制御も障害物を見落とす</text>
<text x="365" y="322" font-size="16" fill="#b83449">衝突方向の指令が出る恐れ</text>
<rect x="680" y="15" width="300" height="325" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
<text x="692" y="48" font-size="18" fill="#25364b">③ 両方検出＋再計画</text>
<rect x="710" y="100" width="240" height="160" fill="#eef2f7" stroke="#8794a5" rx="3"/>
<circle cx="742" cy="180" r="16" fill="#2764b0"/>
<text x="732" y="186" font-size="16" fill="#ffffff">R</text>
<text x="925" y="185" font-size="18" fill="#25364b">G</text>
<rect x="833" y="135" width="25" height="90" fill="#f3c1c9" stroke="#b83449" rx="3"/>
<text x="820" y="125" font-size="15" fill="#b83449">実物</text>
<path d="M760,180 L790,115 L890,115 L920,180" fill="none" stroke="#167451" stroke-width="4"/>
<text x="695" y="295" font-size="17" fill="#167451">閉塞を避ける経路へ更新</text>
<text x="695" y="322" font-size="16" fill="#25364b">更新済みPathを局所へ渡す</text>
<text x="24" y="375" font-size="17" fill="#25364b">緑：大域経路の模式例。赤：実物の閉塞（Costmapで見えているとは限らない）。</text>
<text x="24" y="403" font-size="16" fill="#25364b">両方への反映だけで経路は変わらない。再計画の実行とControllerへの新Pathの受け渡しが必要。</text>
</g></svg>