<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
<title id="title">記録が残る時間の比較</title><desc id="desc">新しいClearingがない標準ObstacleLayerは記録が残る。線形寿命2秒のSTVLは再登録がなければ2秒後に期限切れとなり、1.5秒で再登録されれば約3.5秒まで延長される。</desc>
<defs><pattern id="unknown" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e2e6eb"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#9ba7b6" stroke-width="1.2"/></pattern></defs>
<rect width="720" height="240" fill="#f5f7fa" rx="10"/>
<polyline points="220,25 220,198" fill="none" stroke="#b8c3cf" stroke-width="1"/>
<text x="220" y="225" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#25364b">0 s</text>
<polyline points="332,25 332,198" fill="none" stroke="#b8c3cf" stroke-width="1"/>
<text x="332" y="225" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#25364b">1 s</text>
<polyline points="444,25 444,198" fill="none" stroke="#b8c3cf" stroke-width="1"/>
<text x="444" y="225" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#25364b">2 s</text>
<polyline points="556,25 556,198" fill="none" stroke="#b8c3cf" stroke-width="1"/>
<text x="556" y="225" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#25364b">3 s</text>
<polyline points="668,25 668,198" fill="none" stroke="#b8c3cf" stroke-width="1"/>
<text x="668" y="225" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#25364b">4 s</text>
<text x="15" y="62" text-anchor="start" font-family="sans-serif" font-size="18" fill="#25364b">ObstacleLayer</text>
<rect x="220" y="44" width="448" height="24" fill="#397bb6" stroke="#397bb6" stroke-width="0.6" />
<text x="15" y="118" text-anchor="start" font-family="sans-serif" font-size="18" fill="#25364b">STVL</text>
<rect x="220" y="100" width="224" height="24" fill="#397bb6" stroke="#397bb6" stroke-width="0.6" />
<text x="15" y="174" text-anchor="start" font-family="sans-serif" font-size="18" fill="#25364b">STVL + refresh</text>
<rect x="220" y="156" width="392.0" height="24" fill="#397bb6" stroke="#397bb6" stroke-width="0.6" />
<polyline points="660,50 668,56 660,62" fill="none" stroke="#ffffff" stroke-width="2"/>
<polyline points="388.0,144 388.0,191" fill="none" stroke="#7542c8" stroke-width="3"/>
<text x="388.0" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#7542c8">1.5 s</text>
</svg>
