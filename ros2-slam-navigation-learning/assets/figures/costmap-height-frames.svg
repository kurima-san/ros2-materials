<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">相対高さが同じでも絶対Zは変わる</title><desc id="desc">同じ高さ15cmの障害物が、odom床0mではZ0.15m、map床マイナス0.30mではZマイナス0.15mになる。map下限0mなら除外。上りではmap上限2mを超える例。</desc>
<rect width="100%" height="100%" rx="12" fill="#f8fafc"/>
<g font-family="Noto Sans CJK JP, sans-serif" fill="#25364b">
<rect x="20" y="15" width="300" height="325" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
<text x="35" y="47" font-size="21" fill="#25364b">Local：odom基準</text>
<rect x="350" y="15" width="300" height="325" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
<text x="365" y="47" font-size="21" fill="#25364b">Global：map基準</text>
<rect x="680" y="15" width="300" height="325" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
<text x="695" y="47" font-size="21" fill="#25364b">上り先：map基準</text>
<path d="M45,240 L290,240" fill="none" stroke="#25364b" stroke-width="3"/>
<rect x="130" y="200" width="50" height="40" fill="#f3c1c9" stroke="#b83449" rx="3"/>
<path d="M45,280 L290,280" fill="none" stroke="#2764b0" stroke-width="3" stroke-dasharray="7 5"/>
<text x="45" y="268" font-size="16" fill="#2764b0">下限 −2 m</text>
<text x="35" y="95" font-size="16" fill="#25364b">床 0 → 点 +0.15 m</text>
<path d="M375,260 L620,260" fill="none" stroke="#25364b" stroke-width="3"/>
<rect x="460" y="220" width="50" height="40" fill="#f3c1c9" stroke="#b83449" rx="3"/>
<path d="M375,180 L620,180" fill="none" stroke="#2764b0" stroke-width="3" stroke-dasharray="7 5"/>
<text x="375" y="168" font-size="16" fill="#2764b0">仮の下限 0 m</text>
<text x="365" y="95" font-size="16" fill="#25364b">床 −0.30 → 点 −0.15 m</text>
<path d="M705,220 L950,220" fill="none" stroke="#25364b" stroke-width="3"/>
<rect x="790" y="160" width="50" height="60" fill="#f3c1c9" stroke="#b83449" rx="3"/>
<path d="M705,180 L950,180" fill="none" stroke="#2764b0" stroke-width="3" stroke-dasharray="7 5"/>
<text x="705" y="168" font-size="16" fill="#2764b0">仮の上限 2 m</text>
<text x="695" y="95" font-size="16" fill="#25364b">床 1.90 → 点 2.05 m</text>
<text x="45" y="320" font-size="18" fill="#167451">入力高さ条件を通過</text>
<text x="375" y="320" font-size="18" fill="#b83449">同じ箱なのに下限で除外</text>
<text x="705" y="320" font-size="17" fill="#b83449">上面の観測点が上限で除外</text>
<circle cx="815" cy="160" r="5" fill="#2764b0"/>
<text x="24" y="375" font-size="17" fill="#25364b">説明用の条件。実効値はsource・layerで確認する。各図の縦軸は共通縮尺ではない。</text>
<text x="24" y="403" font-size="17" fill="#25364b">1%勾配でも100 mで床の高度は1 m変化する。床から15 cmと、mapのZは別の量。</text>
</g></svg>