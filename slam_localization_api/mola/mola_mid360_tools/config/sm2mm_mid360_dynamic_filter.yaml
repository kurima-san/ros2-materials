# ---------------------------------------------------------------------------------------------
# Pipeline definition file for sm2mm (simplemap-to-metricmap)
#
# Mid-360 + IMU + dynamic-object removal version.
#
# Processing:
#   raw
#    -> IMU deskew
#    -> remove only very close points (<= 0.1 m)
#    -> accumulate full point cloud into "map"
#    -> build occupancy voxel map "voxelmap"
#    -> split points into static_map / dynamic_map by voxel occupancy
#    -> MLS only on static_map
#    -> merge MLS result into "localmap" for MOLA GICP localization
#
# Based on:
#   - sm2mm_no_decim_imu_mls_keyframe_map.yaml
#   - sm2mm_voxels_static_dynamic_points.yaml
# ---------------------------------------------------------------------------------------------

# --------------------------------------------------------
# 1) Generators
# --------------------------------------------------------
generators:
  # Convert incoming LiDAR observations into point clouds in layer "raw".
  - class_name: mp2p_icp_filters::Generator
    params:
      name: "generator_default"
      filterOutPointsAtZero: true

  # Final localization map expected by the GICP MOLA-LIO pipeline.
  # Nothing is inserted here directly; final_filters will fill it.
  - class_name: mp2p_icp_filters::Generator
    params:
      name: "generator_localmap"
      target_layer: "localmap"
      throw_on_unhandled_observation_class: true
      process_class_names_regex: ""

      metric_map_definition:
        class: mola::KeyframePointCloudMap
        plugin: "libmola_metric_maps.so"
        creationOpts:
          max_search_keyframes: 3
          k_correspondences_for_cov: 20
        insertOpts:
          remove_frames_farther_than: 0
        likelihoodOpts: ~
        renderOpts:
          color.A: 0.25
          colormap: "cmHOT"
          recolorByPointField: "intensity"
          max_points_per_kf: 100000
          max_overall_points: 100000

  # Temporary full point-cloud map used as input to the dynamic-object filter.
  - class_name: mp2p_icp_filters::Generator
    params:
      name: "generator_map"
      target_layer: "map"
      process_class_names_regex: ""

      metric_map_definition:
        class: mrpt::maps::CGenericPointsMap

  # Temporary occupancy voxel map used to distinguish static and dynamic points.
  - class_name: mp2p_icp_filters::Generator
    params:
      name: "generator_voxelmap"
      target_layer: "voxelmap"
      process_class_names_regex: ""

      metric_map_definition:
        class: mrpt::maps::CVoxelMap
        creationOpts:
          # Smaller than the official 0.25 m demo to better separate people indoors.
          resolution: 0.15
        insertOpts:
          prob_miss: 0.45
          prob_hit: 0.65
          clamp_min: 0.05
          clamp_max: 0.95
          ray_trace_free_space: true
          decimation: 1
        likelihoodOpts:
          decimation: 1
          occupiedThreshold: 0.51
        renderOpts:
          occupiedThreshold: 0.51
          freeThreshold: 0.40
          generateFreeVoxels: false

# --------------------------------------------------------
# 2) Per-keyframe filtering
# --------------------------------------------------------
filters:
  # Normalize per-point timestamps so IMU deskew can use them consistently.
  - class_name: mp2p_icp_filters::FilterAdjustTimestamps
    params:
      pointcloud_layer: "raw"
      silently_ignore_no_timestamps: false
      method: "TimestampAdjustMethod::MiddleIsZero"

  # IMU-based motion compensation.
  - class_name: mp2p_icp_filters::FilterDeskew
    params:
      input_pointcloud_layer: "raw"
      output_pointcloud_layer: "deskewed"
      method: MotionCompensationMethod::IMU
      ignore_accelerometer: true
      silently_ignore_no_timestamps: false
      output_layer_class: "mrpt::maps::CGenericPointsMap"

      twist: [vx, vy, vz, wx, wy, wz]

      # In sm2mm, points are already expressed in global coordinates.
      points_already_global: true
      robot_pose:
        [robot_x, robot_y, robot_z, robot_yaw, robot_pitch, robot_roll]

  # Remove only points extremely close to the moving sensor/robot.
  #
  # output_layer_outside means:
  #   0.0 <= range <= 0.1 m : removed
  #   range > 0.1 m         : kept in "filtered"
  #
  # This keeps the floor close to the Mid-360 instead of deleting a large
  # region around the travelled trajectory.
  - class_name: mp2p_icp_filters::FilterByRange
    params:
      input_pointcloud_layer: "deskewed"
      output_layer_outside: "filtered"
      range_min: 0.0
      range_max: 0.1
      metric_l_infinity: true
      center: [robot_x, robot_y, robot_z]

  # Accumulate all filtered points into the temporary full point-cloud map.
  - class_name: mp2p_icp_filters::FilterMerge
    params:
      input_pointcloud_layer: "filtered"
      target_layer: "map"
      robot_pose:
        [robot_x, robot_y, robot_z, robot_yaw, robot_pitch, robot_roll]

  # Downsample only the data used to update occupancy.
  # The final static point cloud itself remains non-decimated before MLS.
  - class_name: mp2p_icp_filters::FilterDecimateVoxels
    params:
      input_pointcloud_layer: "filtered"
      output_pointcloud_layer: "voxel_input"
      voxel_filter_resolution: 0.10
      decimate_method: DecimateMethod::FirstPoint

  # Insert the decimated points into the occupancy voxel map.
  - class_name: mp2p_icp_filters::FilterMerge
    params:
      input_pointcloud_layer: "voxel_input"
      target_layer: "voxelmap"
      robot_pose:
        [robot_x, robot_y, robot_z, robot_yaw, robot_pitch, robot_roll]

  # Per-keyframe temporary layers are no longer needed.
  - class_name: mp2p_icp_filters::FilterDeleteLayer
    params:
      pointcloud_layer_to_remove:
        ["raw", "deskewed", "filtered", "voxel_input"]

# --------------------------------------------------------
# 3) Final, global filtering
# --------------------------------------------------------
final_filters:
  # Split the accumulated point cloud according to voxel occupancy.
  #
  # High-occupancy voxels -> static_map
  # Low-occupancy voxels  -> dynamic_map
  #
  # Start with 0.7. If people remain, try increasing it slightly.
  # If walls/floor disappear too aggressively, lower it.
  - class_name: FilterRemoveByVoxelOccupancy
    params:
      input_pointcloud_layer: "map"
      input_voxel_layer: "voxelmap"
      output_layer_static_objects: "static_map"
      output_layer_dynamic_objects: "dynamic_map"
      occupancy_threshold: 0.7

  # Apply MLS only to the static point cloud.
  - class_name: mp2p_icp_filters::FilterMLS
    params:
      input_pointcloud_layer: "static_map"
      output_pointcloud_layer: "mls"
      output_layer_class: "mrpt::maps::CGenericPointsMap"

      search_radius: 0.10
      polynomial_order: 2
      min_neighbors_for_fit: 10

      projection_method: FilterMLS::ProjectionMethod::SIMPLE
      upsampling_method: FilterMLS::UpsamplingMethod::NONE

      parallelization_grain_size: 1024

  # Build the localization map expected by the GICP pipeline.
  - class_name: mp2p_icp_filters::FilterMerge
    params:
      input_pointcloud_layer: "mls"
      target_layer: "localmap"

  # Keep only "localmap" in the final .mm file.
  #
  # During parameter tuning, remove "dynamic_map" and/or "static_map" from this
  # list if you want to inspect them in mm-viewer.
  - class_name: mp2p_icp_filters::FilterDeleteLayer
    params:
      pointcloud_layer_to_remove:
        ["map", "voxelmap", "static_map", "dynamic_map", "mls"]
