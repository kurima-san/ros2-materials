services:
  sensor:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      args:
        ROS_DISTRO: ${ROS_DISTRO:-lyrical}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    command: ros2 run docker_ros2_lab fake_lidar
  processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      args:
        ROS_DISTRO: ${ROS_DISTRO:-lyrical}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    command: ros2 run docker_ros2_lab scan_monitor
