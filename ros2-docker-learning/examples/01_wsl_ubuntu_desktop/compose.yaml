services:
  desktop:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      args:
        ROS_DISTRO: ${ROS_DISTRO:-lyrical}
    image: ros2-lab-dev:${ROS_DISTRO:-lyrical}
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      VNC_PASSWORD: ${VNC_PASSWORD:-ros2}
      VNC_GEOMETRY: ${VNC_GEOMETRY:-1600x900}
      AUTO_START_RVIZ: "1"
    volumes:
      - .:/workspace
    shm_size: "1gb"
    stdin_open: true
    tty: true

  fake_lidar:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      args:
        ROS_DISTRO: ${ROS_DISTRO:-lyrical}
    image: ros2-lab-runtime:${ROS_DISTRO:-lyrical}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    command: ros2 run docker_ros2_lab fake_lidar

  monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      args:
        ROS_DISTRO: ${ROS_DISTRO:-lyrical}
    image: ros2-lab-runtime:${ROS_DISTRO:-lyrical}
    depends_on:
      - fake_lidar
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    command: ros2 run docker_ros2_lab scan_monitor
